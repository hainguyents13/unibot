[package]
name = "unibot"
version = "0.1.0"
description = "A Windows messenger for your Hermes Bots"
authors = ["hai"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unibot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers lets requests go without an Origin header, as Usual Bot sends them.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-websocket = "2"
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-winrt-notification = "0.8.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
